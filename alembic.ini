[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Overridden by the DATABASE_URL environment variable (see migrations/env.py).
sqlalchemy.url = postgresql+psycopg://outbox:outbox_local_dev@127.0.0.1:55432/outbox

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
