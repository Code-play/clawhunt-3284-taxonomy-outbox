[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonomy-outbox"
version = "1.0.0"
description = "Transactional outbox publisher for taxonomy tag lifecycle events (member space platform)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["taxonomy_outbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "acceptance: maps to one acceptance criterion of ticket S2-TAX-022",
  "integration: requires a live PostgreSQL 16 instance",
]
