services:
  db:
    image: postgres:16-alpine
    container_name: taxonomy-outbox-db
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox_local_dev
      POSTGRES_DB: outbox
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - taxonomy_outbox_pgdata:/var/lib/postgresql/data

volumes:
  taxonomy_outbox_pgdata:
